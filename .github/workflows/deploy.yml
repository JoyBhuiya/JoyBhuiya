name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/uk-life-test-prep-site-b2xyvb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Validate question bank
        run: npm run validate:questions

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Pages has to be switched on once, by hand, at
      # Settings → Pages → Source → "GitHub Actions". The workflow token is not
      # permitted to create the Pages site itself ("Resource not accessible by
      # integration"), so this step fails until that is done. `enablement` is
      # left on because it is a no-op once the site exists.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
